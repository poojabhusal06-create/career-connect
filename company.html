<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .login-box {
            max-width: 400px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #1e3a8a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Company Login</h1>

        <form onsubmit="companyLogin(event)">

            <label>Company Name</label>
            <input
                type="text"
                id="companyName"
                placeholder="Enter Company Name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="companyEmail"
                placeholder="Enter Email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="companyPassword"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="back">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

    <script>
        function companyLogin(event) {

            event.preventDefault();

            localStorage.setItem("companyLoggedIn", "true");

            alert("Company Login Successful!");

            window.location.href = "post-job.html";
        }
    </script>

</body>

</html>
