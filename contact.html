<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Admin</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .contact-box {
            max-width: 550px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #1e3a8a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="contact-box">

        <h1>Contact Admin</h1>

        <form onsubmit="sendMessage(event)">

            <label>Name</label>
            <input
                type="text"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                placeholder="Enter your email"
                required
            >

            <label>Message</label>
            <textarea
                placeholder="Enter your message"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

        <div class="back">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

    <script>
        function sendMessage(event) {

            event.preventDefault();

            alert("Your message has been sent to Admin!");

            window.location.href = "index.html";
        }
    </script>

</body>

</html>
