<!DOCTYPE html>
<html>
<head>
    <title>Online Job Portal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #007bff;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .top-buttons button {
            background: white;
            color: #007bff;
            border: none;
            padding: 10px 15px;
            margin-left: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 60px 20px 30px;
        }

        .hero h1 {
            color: #222;
            font-size: 36px;
        }

        .hero p {
            color: #555;
            font-size: 18px;
        }

        .main-buttons {
            text-align: center;
            margin: 30px auto;
            max-width: 700px;
        }

        .main-buttons button {
            width: 200px;
            padding: 15px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .main-buttons button:hover {
            background: #0056b3;
        }

        .about {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        footer {
            text-align: center;
            background: #222;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>

    <h2>Online Job Portal</h2>

    <div class="top-buttons">

        <button onclick="window.location.href='contact.html'">
            Contact Admin
        </button>

        <button onclick="window.location.href='admin.html'">
            Admin Login
        </button>

    </div>

</header>


<div class="hero">

    <h1>Welcome to Online Job Portal</h1>

    <p>
        Find the right job and build your career with us.
    </p>

</div>


<div class="main-buttons">

    <button onclick="window.location.href='student.html'">
        Student Login
    </button>

    <button onclick="window.location.href='company.html'">
        Company Login
    </button>

    <button onclick="window.location.href='job.html'">
        Search Job
    </button>

</div>


<div class="about">

    <h2>About Online Job Portal</h2>

    <p>
        Online Job Portal is a platform where students can search
        and apply for jobs, while companies can post job opportunities.
    </p>

    <p>
        The system helps students
